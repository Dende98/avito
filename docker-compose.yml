services:
  postgres:
    image: postgres:16-alpine
    container_name: delta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arkhem
    ports:
      - "5433:5432"
    volumes:
      - delta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arkhem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  delta_postgres_data:
